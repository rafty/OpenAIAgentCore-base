[project]
name = "openaiagentcore-base"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.252.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[dependency-groups]
dev = [
    "bedrock-agentcore==1.20.0",
    "boto3==1.43.65",
    "botocore==1.43.65",
    "jsonschema==4.26.0",
    "mcp==1.29.0",
    "mcp-proxy-for-aws==1.6.4",
    "openai-agents==0.19.4",
    "openai[bedrock]==2.53.0",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = [".", "agents/src"]
